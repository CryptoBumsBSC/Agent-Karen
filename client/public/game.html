<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Bud Invaders</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    #gameContainer { position: relative; touch-action: none; }
    #gameCanvas { display: block; border: 2px solid #4ade80; border-radius: 8px; }
    #startScreen, #gameOverScreen, #winScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(10, 10, 26, 0.95); border-radius: 8px;
    }
    h1 { color: #4ade80; font-size: 1.6rem; margin-bottom: 0.5rem; text-shadow: 0 0 20px #4ade80; text-align: center; }
    h2 { color: #22c55e; font-size: 1.4rem; margin-bottom: 1rem; }
    .subtitle { color: #86efac; font-size: 0.95rem; margin-bottom: 1.5rem; text-align: center; padding: 0 1rem; }
    .score-display { color: #fbbf24; font-size: 1.4rem; margin: 1rem 0; }
    button {
      background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none;
      padding: 0.9rem 1.8rem; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin: 0.5rem;
    }
    button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
    .controls { color: #9ca3af; font-size: 0.8rem; margin-top: 1.2rem; text-align: center; padding: 0 1rem; }
    .hidden { display: none !important; }
    #hud {
      position: absolute; top: 8px; left: 10px; right: 10px;
      display: flex; justify-content: space-between;
      color: #4ade80; font-size: 0.9rem; font-weight: bold;
      text-shadow: 0 0 5px rgba(0,0,0,0.8); pointer-events: none;
    }
    .level-display { color: #60a5fa; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="hud" class="hidden">
      <span id="scoreHud">Score: 0</span>
      <span id="levelHud" class="level-display">Wave 1</span>
      <span id="livesHud">Lives: 3</span>
    </div>
    
    <div id="startScreen">
      <h1>SPACE BUD INVADERS</h1>
      <p class="subtitle">Dudley defends Earth from evil alien buds!</p>
      <button id="startBtn">START GAME</button>
      <div class="controls">
        <p>Tap left/right to move, center to shoot</p>
        <p>Desktop: Arrow keys + Space</p>
      </div>
    </div>
    
    <div id="gameOverScreen" class="hidden">
      <h2>GAME OVER</h2>
      <p class="score-display">Score: <span id="finalScore">0</span></p>
      <p class="subtitle" id="highScoreText"></p>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>
    
    <div id="winScreen" class="hidden">
      <h2>WAVE COMPLETE!</h2>
      <p class="score-display">Score: <span id="waveScore">0</span></p>
      <button id="nextWaveBtn">NEXT WAVE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const winScreen = document.getElementById('winScreen');
    const hud = document.getElementById('hud');
    const scoreHud = document.getElementById('scoreHud');
    const levelHud = document.getElementById('levelHud');
    const livesHud = document.getElementById('livesHud');
    const finalScore = document.getElementById('finalScore');
    const waveScore = document.getElementById('waveScore');
    const highScoreText = document.getElementById('highScoreText');

    function resizeCanvas() {
      const maxWidth = Math.min(window.innerWidth - 16, 380);
      const maxHeight = Math.min(window.innerHeight - 16, 580);
      canvas.width = maxWidth;
      canvas.height = maxHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let gameRunning = false;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let highScore = parseInt(localStorage.getItem('spaceBudHighScore') || '0');

    const player = { x: 0, y: 0, width: 36, height: 40, speed: 5 };

    let invaders = [];
    let invaderDirection = 1;
    let invaderSpeed = 1;
    let playerBullets = [];
    let enemyBullets = [];
    let particles = [];
    let stars = [];

    let keys = { left: false, right: false, shoot: false };
    let lastShot = 0;
    const shootCooldown = 350;

    // Bud strain colors for enemies
    const budStrains = [
      { name: 'Purple Haze', color: '#a855f7', darkColor: '#7c3aed', points: 30 },
      { name: 'Blue Dream', color: '#3b82f6', darkColor: '#2563eb', points: 25 },
      { name: 'Orange Kush', color: '#f97316', darkColor: '#ea580c', points: 20 },
      { name: 'Sour Diesel', color: '#eab308', darkColor: '#ca8a04', points: 15 },
      { name: 'Northern Lights', color: '#14b8a6', darkColor: '#0d9488', points: 10 }
    ];

    function initStars() {
      stars = [];
      for (let i = 0; i < 40; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 0.4 + 0.1
        });
      }
    }

    // Draw a cannabis bud shape
    function drawBud(x, y, width, height, color, darkColor, glow = false) {
      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
      }
      
      const cx = x + width / 2;
      const cy = y + height / 2;
      
      // Main bud body (oval cluster shape)
      ctx.fillStyle = color;
      
      // Center large nugget
      ctx.beginPath();
      ctx.ellipse(cx, cy, width * 0.35, height * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Top cluster
      ctx.beginPath();
      ctx.ellipse(cx, cy - height * 0.25, width * 0.25, height * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Left cluster
      ctx.beginPath();
      ctx.ellipse(cx - width * 0.2, cy + height * 0.1, width * 0.2, height * 0.22, -0.3, 0, Math.PI * 2);
      ctx.fill();
      
      // Right cluster
      ctx.beginPath();
      ctx.ellipse(cx + width * 0.2, cy + height * 0.1, width * 0.2, height * 0.22, 0.3, 0, Math.PI * 2);
      ctx.fill();
      
      // Small sugar leaves (darker accents)
      ctx.fillStyle = darkColor;
      ctx.beginPath();
      ctx.ellipse(cx - width * 0.15, cy - height * 0.15, width * 0.08, height * 0.12, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + width * 0.18, cy - height * 0.1, width * 0.07, height * 0.1, 0.4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.shadowBlur = 0;
    }

    // Draw player bud (Dudley - green defender)
    function drawPlayerBud(x, y, width, height) {
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 15;
      
      const cx = x + width / 2;
      const cy = y + height / 2;
      
      // Main green bud
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.ellipse(cx, cy + height * 0.05, width * 0.38, height * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(cx, cy - height * 0.22, width * 0.28, height * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(cx - width * 0.22, cy + height * 0.12, width * 0.2, height * 0.24, -0.3, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(cx + width * 0.22, cy + height * 0.12, width * 0.2, height * 0.24, 0.3, 0, Math.PI * 2);
      ctx.fill();
      
      // Darker accents
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.ellipse(cx, cy - height * 0.08, width * 0.12, height * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Eyes (cute face)
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(cx - width * 0.12, cy - height * 0.05, 3, 0, Math.PI * 2);
      ctx.arc(cx + width * 0.12, cy - height * 0.05, 3, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.shadowBlur = 0;
    }

    function createInvaders() {
      invaders = [];
      const rows = 5;
      const cols = Math.floor((canvas.width - 50) / 42);
      const invWidth = 28;
      const invHeight = 30;
      const padding = 8;
      const startX = (canvas.width - (cols * (invWidth + padding))) / 2;
      const startY = 55;

      for (let row = 0; row < rows; row++) {
        const strain = budStrains[row % budStrains.length];
        for (let col = 0; col < cols; col++) {
          invaders.push({
            x: startX + col * (invWidth + padding),
            y: startY + row * (invHeight + padding),
            width: invWidth,
            height: invHeight,
            color: strain.color,
            darkColor: strain.darkColor,
            points: strain.points,
            row: row
          });
        }
      }

      invaderSpeed = 1 + (wave - 1) * 0.25;
      invaderDirection = 1;
    }

    function initGame() {
      player.x = canvas.width / 2 - player.width / 2;
      player.y = canvas.height - player.height - 15;
      playerBullets = [];
      enemyBullets = [];
      particles = [];
      score = 0;
      lives = 3;
      wave = 1;
      initStars();
      createInvaders();
    }

    function createExplosion(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          size: Math.random() * 4 + 2,
          color,
          life: 1
        });
      }
    }

    function shoot() {
      const now = Date.now();
      if (now - lastShot < shootCooldown) return;
      lastShot = now;
      
      // Seed bullet (green)
      playerBullets.push({
        x: player.x + player.width / 2 - 4,
        y: player.y,
        width: 8,
        height: 12,
        speed: 7,
        color: '#86efac'
      });
    }

    function enemyShoot(invader) {
      enemyBullets.push({
        x: invader.x + invader.width / 2 - 3,
        y: invader.y + invader.height,
        width: 6,
        height: 10,
        speed: 3.5 + wave * 0.4,
        color: invader.color
      });
    }

    function update() {
      if (!gameRunning) return;

      if (keys.left && player.x > 0) player.x -= player.speed;
      if (keys.right && player.x < canvas.width - player.width) player.x += player.speed;
      if (keys.shoot) shoot();

      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
      });

      playerBullets = playerBullets.filter(b => { b.y -= b.speed; return b.y > -b.height; });

      enemyBullets = enemyBullets.filter(b => {
        b.y += b.speed;
        if (rectCollision(b, player)) {
          lives--;
          livesHud.textContent = `Lives: ${lives}`;
          createExplosion(player.x + player.width/2, player.y + player.height/2, '#4ade80', 10);
          if (lives <= 0) endGame();
          return false;
        }
        return b.y < canvas.height;
      });

      let hitEdge = false;
      let lowestY = 0;
      
      invaders.forEach(inv => {
        inv.x += invaderSpeed * invaderDirection;
        if (inv.x <= 0 || inv.x + inv.width >= canvas.width) hitEdge = true;
        if (inv.y + inv.height > lowestY) lowestY = inv.y + inv.height;
      });

      if (hitEdge) {
        invaderDirection *= -1;
        invaders.forEach(inv => { inv.y += 18; });
      }

      if (lowestY > player.y - 15) { endGame(); return; }

      if (invaders.length > 0 && Math.random() < 0.004 + wave * 0.002) {
        const shooter = invaders[Math.floor(Math.random() * invaders.length)];
        enemyShoot(shooter);
      }

      playerBullets.forEach((b, bi) => {
        for (let i = invaders.length - 1; i >= 0; i--) {
          if (rectCollision(b, invaders[i])) {
            score += invaders[i].points;
            scoreHud.textContent = `Score: ${score}`;
            createExplosion(invaders[i].x + invaders[i].width/2, invaders[i].y + invaders[i].height/2, invaders[i].color);
            invaders.splice(i, 1);
            playerBullets.splice(bi, 1);
            break;
          }
        }
      });

      if (invaders.length === 0) { waveComplete(); return; }

      particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.035;
        return p.life > 0;
      });
    }

    function rectCollision(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
    }

    function draw() {
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + star.size * 0.15})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      if (!gameRunning) return;

      // Draw player (Dudley bud)
      drawPlayerBud(player.x, player.y, player.width, player.height);

      // Draw enemy buds
      invaders.forEach(inv => {
        drawBud(inv.x, inv.y, inv.width, inv.height, inv.color, inv.darkColor, true);
      });

      // Draw player bullets (seeds)
      playerBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.ellipse(b.x + b.width/2, b.y + b.height/2, b.width/2, b.height/2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Draw enemy bullets (colored seeds)
      enemyBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.ellipse(b.x + b.width/2, b.y + b.height/2, b.width/2, b.height/2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Draw particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

    function startGame() {
      initGame();
      gameRunning = true;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      winScreen.classList.add('hidden');
      hud.classList.remove('hidden');
      scoreHud.textContent = `Score: ${score}`;
      levelHud.textContent = `Wave ${wave}`;
      livesHud.textContent = `Lives: ${lives}`;
    }

    function waveComplete() {
      gameRunning = false;
      waveScore.textContent = score;
      winScreen.classList.remove('hidden');
    }

    function nextWave() {
      wave++;
      winScreen.classList.add('hidden');
      createInvaders();
      enemyBullets = [];
      playerBullets = [];
      player.x = canvas.width / 2 - player.width / 2;
      gameRunning = true;
      levelHud.textContent = `Wave ${wave}`;
    }

    function endGame() {
      gameRunning = false;
      hud.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
      finalScore.textContent = score;
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('spaceBudHighScore', highScore.toString());
        highScoreText.textContent = 'NEW HIGH SCORE!';
      } else {
        highScoreText.textContent = `High Score: ${highScore}`;
      }
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('nextWaveBtn').addEventListener('click', nextWave);

    document.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space') { keys.shoot = true; e.preventDefault(); }
    });

    document.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space') keys.shoot = false;
    });

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      
      if (x < canvas.width * 0.33) keys.left = true;
      else if (x > canvas.width * 0.66) keys.right = true;
      else keys.shoot = true;
    });

    canvas.addEventListener('touchend', e => { keys.left = false; keys.right = false; keys.shoot = false; });

    initStars();
    gameLoop();
  </script>
</body>
</html>
