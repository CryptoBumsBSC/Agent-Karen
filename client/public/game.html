<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Bud Invaders</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    #gameContainer {
      position: relative;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      border: 2px solid #4ade80;
      border-radius: 8px;
    }
    #startScreen, #gameOverScreen, #winScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 10, 26, 0.95);
      border-radius: 8px;
    }
    h1 {
      color: #4ade80;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px #4ade80;
      text-align: center;
    }
    h2 {
      color: #22c55e;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .subtitle {
      color: #86efac;
      font-size: 1rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .score-display {
      color: #fbbf24;
      font-size: 1.5rem;
      margin: 1rem 0;
    }
    button {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      margin: 0.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
    }
    .controls {
      color: #9ca3af;
      font-size: 0.85rem;
      margin-top: 1.5rem;
      text-align: center;
      padding: 0 1rem;
    }
    .hidden {
      display: none !important;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      color: #4ade80;
      font-size: 1rem;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .level-display {
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="hud" class="hidden">
      <span id="scoreHud">Score: 0</span>
      <span id="levelHud" class="level-display">Wave 1</span>
      <span id="livesHud">Lives: 3</span>
    </div>
    
    <div id="startScreen">
      <h1>SPACE BUD INVADERS</h1>
      <p class="subtitle">Defend Earth from the Scammer Aliens!</p>
      <button id="startBtn">START GAME</button>
      <div class="controls">
        <p>Mobile: Tap left/right sides to move</p>
        <p>Tap center to shoot</p>
        <p>Desktop: Arrow keys + Space</p>
      </div>
    </div>
    
    <div id="gameOverScreen" class="hidden">
      <h2>GAME OVER</h2>
      <p class="score-display">Score: <span id="finalScore">0</span></p>
      <p class="subtitle" id="highScoreText"></p>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>
    
    <div id="winScreen" class="hidden">
      <h2>WAVE COMPLETE!</h2>
      <p class="score-display">Score: <span id="waveScore">0</span></p>
      <button id="nextWaveBtn">NEXT WAVE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const winScreen = document.getElementById('winScreen');
    const hud = document.getElementById('hud');
    const scoreHud = document.getElementById('scoreHud');
    const levelHud = document.getElementById('levelHud');
    const livesHud = document.getElementById('livesHud');
    const finalScore = document.getElementById('finalScore');
    const waveScore = document.getElementById('waveScore');
    const highScoreText = document.getElementById('highScoreText');

    // Responsive canvas sizing
    function resizeCanvas() {
      const maxWidth = Math.min(window.innerWidth - 20, 400);
      const maxHeight = Math.min(window.innerHeight - 20, 600);
      canvas.width = maxWidth;
      canvas.height = maxHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Game state
    let gameRunning = false;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let highScore = parseInt(localStorage.getItem('spaceBudHighScore') || '0');

    // Player
    const player = {
      x: 0,
      y: 0,
      width: 40,
      height: 30,
      speed: 5,
      color: '#4ade80'
    };

    // Invaders grid
    let invaders = [];
    let invaderDirection = 1;
    let invaderSpeed = 1;
    let invaderDropAmount = 20;
    let invaderShootChance = 0.005;

    // Bullets
    let playerBullets = [];
    let enemyBullets = [];
    let particles = [];
    let stars = [];

    // Shields/barriers
    let shields = [];

    // Controls
    let keys = { left: false, right: false, shoot: false };
    let lastShot = 0;
    const shootCooldown = 400;

    // Invader types with colors
    const invaderTypes = [
      { color: '#ef4444', points: 30, rows: [0] },      // Red - top row
      { color: '#f97316', points: 20, rows: [1, 2] },   // Orange - middle rows
      { color: '#eab308', points: 10, rows: [3, 4] }    // Yellow - bottom rows
    ];

    // Initialize stars background
    function initStars() {
      stars = [];
      for (let i = 0; i < 50; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 1,
          speed: Math.random() * 0.5 + 0.2
        });
      }
    }

    // Create invader grid
    function createInvaders() {
      invaders = [];
      const rows = 5;
      const cols = Math.floor((canvas.width - 60) / 45);
      const invaderWidth = 30;
      const invaderHeight = 25;
      const padding = 10;
      const startX = (canvas.width - (cols * (invaderWidth + padding))) / 2;
      const startY = 60;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const type = invaderTypes.find(t => t.rows.includes(row)) || invaderTypes[2];
          invaders.push({
            x: startX + col * (invaderWidth + padding),
            y: startY + row * (invaderHeight + padding),
            width: invaderWidth,
            height: invaderHeight,
            color: type.color,
            points: type.points,
            row: row
          });
        }
      }

      // Increase difficulty per wave
      invaderSpeed = 1 + (wave - 1) * 0.3;
      invaderShootChance = 0.005 + (wave - 1) * 0.002;
      invaderDirection = 1;
    }

    // Create shields
    function createShields() {
      shields = [];
      const shieldCount = 4;
      const shieldWidth = 50;
      const spacing = canvas.width / (shieldCount + 1);
      
      for (let i = 0; i < shieldCount; i++) {
        shields.push({
          x: spacing * (i + 1) - shieldWidth / 2,
          y: canvas.height - 120,
          width: shieldWidth,
          height: 30,
          health: 4,
          color: '#22c55e'
        });
      }
    }

    // Initialize game
    function initGame() {
      player.x = canvas.width / 2 - player.width / 2;
      player.y = canvas.height - player.height - 20;
      playerBullets = [];
      enemyBullets = [];
      particles = [];
      score = 0;
      lives = 3;
      wave = 1;
      initStars();
      createInvaders();
      createShields();
    }

    // Create explosion particles
    function createExplosion(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          size: Math.random() * 4 + 2,
          color,
          life: 1
        });
      }
    }

    // Player shoot
    function shoot() {
      const now = Date.now();
      if (now - lastShot < shootCooldown) return;
      lastShot = now;
      
      playerBullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 15,
        speed: 8,
        color: '#22d3ee'
      });
    }

    // Enemy shoot
    function enemyShoot(invader) {
      enemyBullets.push({
        x: invader.x + invader.width / 2 - 2,
        y: invader.y + invader.height,
        width: 4,
        height: 12,
        speed: 4 + wave * 0.5,
        color: '#f43f5e'
      });
    }

    // Update game
    function update() {
      if (!gameRunning) return;

      // Player movement
      if (keys.left && player.x > 0) player.x -= player.speed;
      if (keys.right && player.x < canvas.width - player.width) player.x += player.speed;
      if (keys.shoot) shoot();

      // Update stars
      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
      });

      // Update player bullets
      playerBullets = playerBullets.filter(b => {
        b.y -= b.speed;
        return b.y > -b.height;
      });

      // Update enemy bullets
      enemyBullets = enemyBullets.filter(b => {
        b.y += b.speed;
        
        // Hit player
        if (rectCollision(b, player)) {
          lives--;
          livesHud.textContent = `Lives: ${lives}`;
          createExplosion(player.x + player.width/2, player.y + player.height/2, player.color, 12);
          if (lives <= 0) {
            endGame();
          }
          return false;
        }
        
        // Hit shields
        for (let i = shields.length - 1; i >= 0; i--) {
          if (rectCollision(b, shields[i])) {
            shields[i].health--;
            if (shields[i].health <= 0) {
              createExplosion(shields[i].x + shields[i].width/2, shields[i].y + shields[i].height/2, shields[i].color);
              shields.splice(i, 1);
            }
            return false;
          }
        }
        
        return b.y < canvas.height;
      });

      // Move invaders
      let hitEdge = false;
      let lowestY = 0;
      
      invaders.forEach(inv => {
        inv.x += invaderSpeed * invaderDirection;
        if (inv.x <= 0 || inv.x + inv.width >= canvas.width) {
          hitEdge = true;
        }
        if (inv.y + inv.height > lowestY) {
          lowestY = inv.y + inv.height;
        }
      });

      if (hitEdge) {
        invaderDirection *= -1;
        invaders.forEach(inv => {
          inv.y += invaderDropAmount;
        });
      }

      // Invaders reached bottom
      if (lowestY > player.y - 20) {
        endGame();
        return;
      }

      // Invaders shoot randomly
      if (invaders.length > 0 && Math.random() < invaderShootChance) {
        const shooter = invaders[Math.floor(Math.random() * invaders.length)];
        enemyShoot(shooter);
      }

      // Player bullets hit invaders
      playerBullets.forEach((b, bi) => {
        for (let i = invaders.length - 1; i >= 0; i--) {
          if (rectCollision(b, invaders[i])) {
            score += invaders[i].points;
            scoreHud.textContent = `Score: ${score}`;
            createExplosion(invaders[i].x + invaders[i].width/2, invaders[i].y + invaders[i].height/2, invaders[i].color);
            invaders.splice(i, 1);
            playerBullets.splice(bi, 1);
            break;
          }
        }
        
        // Hit shields
        for (let i = shields.length - 1; i >= 0; i--) {
          if (rectCollision(b, shields[i])) {
            playerBullets.splice(bi, 1);
            break;
          }
        }
      });

      // Check wave complete
      if (invaders.length === 0) {
        waveComplete();
        return;
      }

      // Update particles
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        return p.life > 0;
      });
    }

    // Collision detection
    function rectCollision(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }

    // Draw invader shape
    function drawInvader(inv) {
      ctx.fillStyle = inv.color;
      ctx.shadowColor = inv.color;
      ctx.shadowBlur = 8;
      
      const x = inv.x;
      const y = inv.y;
      const w = inv.width;
      const h = inv.height;
      
      // Classic space invader shape
      ctx.beginPath();
      ctx.moveTo(x + w * 0.3, y);
      ctx.lineTo(x + w * 0.7, y);
      ctx.lineTo(x + w * 0.7, y + h * 0.3);
      ctx.lineTo(x + w, y + h * 0.3);
      ctx.lineTo(x + w, y + h * 0.7);
      ctx.lineTo(x + w * 0.8, y + h * 0.7);
      ctx.lineTo(x + w * 0.8, y + h);
      ctx.lineTo(x + w * 0.6, y + h);
      ctx.lineTo(x + w * 0.6, y + h * 0.7);
      ctx.lineTo(x + w * 0.4, y + h * 0.7);
      ctx.lineTo(x + w * 0.4, y + h);
      ctx.lineTo(x + w * 0.2, y + h);
      ctx.lineTo(x + w * 0.2, y + h * 0.7);
      ctx.lineTo(x, y + h * 0.7);
      ctx.lineTo(x, y + h * 0.3);
      ctx.lineTo(x + w * 0.3, y + h * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Draw game
    function draw() {
      // Clear canvas
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw stars
      stars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + star.size * 0.2})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      if (!gameRunning) return;

      // Draw shields
      shields.forEach(s => {
        const alpha = s.health / 4;
        ctx.fillStyle = s.color;
        ctx.globalAlpha = alpha;
        ctx.fillRect(s.x, s.y, s.width, s.height);
        ctx.globalAlpha = 1;
      });

      // Draw player (spaceship)
      ctx.fillStyle = player.color;
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.moveTo(player.x + player.width/2, player.y);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.lineTo(player.x + player.width * 0.7, player.y + player.height * 0.7);
      ctx.lineTo(player.x + player.width * 0.3, player.y + player.height * 0.7);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw invaders
      invaders.forEach(inv => drawInvader(inv));

      // Draw player bullets
      playerBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        ctx.shadowBlur = 0;
      });

      // Draw enemy bullets
      enemyBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 8;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        ctx.shadowBlur = 0;
      });

      // Draw particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    // Game loop
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Start game
    function startGame() {
      initGame();
      gameRunning = true;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      winScreen.classList.add('hidden');
      hud.classList.remove('hidden');
      scoreHud.textContent = `Score: ${score}`;
      levelHud.textContent = `Wave ${wave}`;
      livesHud.textContent = `Lives: ${lives}`;
    }

    // Wave complete
    function waveComplete() {
      gameRunning = false;
      waveScore.textContent = score;
      winScreen.classList.remove('hidden');
    }

    // Next wave
    function nextWave() {
      wave++;
      winScreen.classList.add('hidden');
      createInvaders();
      createShields();
      enemyBullets = [];
      playerBullets = [];
      player.x = canvas.width / 2 - player.width / 2;
      gameRunning = true;
      levelHud.textContent = `Wave ${wave}`;
    }

    // End game
    function endGame() {
      gameRunning = false;
      hud.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
      finalScore.textContent = score;
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('spaceBudHighScore', highScore.toString());
        highScoreText.textContent = 'NEW HIGH SCORE!';
      } else {
        highScoreText.textContent = `High Score: ${highScore}`;
      }
    }

    // Event listeners
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('nextWaveBtn').addEventListener('click', nextWave);

    // Keyboard controls
    document.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space') { keys.shoot = true; e.preventDefault(); }
    });

    document.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space') keys.shoot = false;
    });

    // Touch controls
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      
      if (x < canvas.width * 0.33) {
        keys.left = true;
      } else if (x > canvas.width * 0.66) {
        keys.right = true;
      } else {
        keys.shoot = true;
      }
    });

    canvas.addEventListener('touchend', e => {
      keys.left = false;
      keys.right = false;
      keys.shoot = false;
    });

    // Start game loop
    initStars();
    gameLoop();
  </script>
</body>
</html>
